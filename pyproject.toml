[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-quota-ping"
version = "0.2.0"
description = "Cross-platform minimal-cost 5-hour quota window refresher for Claude Code, Codex, and Antigravity with live quota reset verification and notifications."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "JasonJarvan"},
]
keywords = ["claude-code", "codex", "antigravity", "agy", "quota", "cron", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
quota-ping = "agents_quota_ping.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
